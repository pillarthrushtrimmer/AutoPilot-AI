[project]
name = "autopilot-ai"
version = "1.0.0"
description = "Open-source autonomous AI agent framework — multi-agent systems with tool use, memory, and plugins"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "jebo"}]
license = {text = "Apache-2.0"}
keywords = [
    "ai-agent", "autonomous-agents", "llm", "multi-agent",
    "openai", "anthropic", "ollama", "groq", "ai-framework",
    "task-automation", "vector-memory", "chromadb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40.0",
    "chromadb>=0.5.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4.0", "mypy>=1.10"]

[project.scripts]
autopilot = "src.main:app"

[project.urls]
Homepage = "https://github.com/jebo/autopilot-ai"
Documentation = "https://autopilot-ai.dev"
Repository = "https://github.com/jebo/autopilot-ai"
Issues = "https://github.com/jebo/autopilot-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
